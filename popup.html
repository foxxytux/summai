<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Summai</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="header">
        <div>
          <p class="eyebrow">OpenRouter summary</p>
          <h1>Summai</h1>
        </div>
        <div class="actions">
          <label class="level-control" for="summaryLevel">
            <span class="level-label">Level</span>
            <select id="summaryLevel" aria-label="Summary level">
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
              <option value="xhigh">XHigh</option>
            </select>
          </label>
          <button id="uploadPdfButton" class="ghost-button" type="button">Upload PDF</button>
          <button id="refreshButton" class="ghost-button" type="button">Re-summarize</button>
          <button id="openSummaryButton" class="ghost-button" type="button">Open page</button>
          <button id="optionsButton" class="ghost-button" type="button">Options</button>
        </div>
      </header>

      <section class="card status-card">
        <div id="status" class="status">Summarizing the current page...</div>
      </section>

      <section class="card">
        <div class="summary-shell">
          <pre id="summary" class="summary" aria-live="polite"></pre>
        </div>
      </section>
    </main>
    <input id="pdfInput" type="file" accept="application/pdf" hidden />
    <script src="popup.js"></script>
  </body>
</html>
